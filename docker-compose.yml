# Optional: run Ollama (the local LLM) in a container.
# The Python ML services are NOT containerized here because they need Apple's
# Metal (MPS) GPU, which Docker on macOS cannot access. Run those natively.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:

